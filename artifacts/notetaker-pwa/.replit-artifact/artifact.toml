kind = "web"
previewPath = "/notetaker-pwa/"
title = "ReMynd Notetaker PWA"
version = "1.0.0"
id = "artifacts/notetaker-pwa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/notetaker-pwa/" ]
localPort = 23942

[services.development]
run = "pnpm --filter @workspace/notetaker-pwa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/notetaker-pwa", "run", "build" ]
publicDir = "artifacts/notetaker-pwa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23942"
BASE_PATH = "/notetaker-pwa/"
