kind = "mobile"
previewPath = "/notetaker/"
title = "ReMynd Notetaker"
version = "1.0.0"
id = "artifacts/notetaker"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/notetaker/" ]
localPort = 22800

[services.development]
run = "pnpm --filter @workspace/notetaker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/notetaker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/notetaker", "run", "serve" ]

[services.env]
PORT = "22800"
BASE_PATH = "/notetaker/"
