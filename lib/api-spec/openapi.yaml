          type: string
        parentAssignmentId:
          type: string
        teacherAssignmentId:
          type: string
        parentRevision:
          type: integer
        teacherRevision:
          type: integer
        generatedAt:
          type: string
          format: date-time
        content:
          $ref: "#/components/schemas/ChineseLiteracyDashboardComparisonContent"
        stale:
          type: boolean
      required: [caseId, parentAssignmentId, teacherAssignmentId, parentRevision, teacherRevision, generatedAt, content, stale]

    ChineseLiteracyDashboardResponse:
      type: object
      properties:
        caseId:
          type: string
        administrations:
          type: array
          items:
            $ref: "#/components/schemas/ChineseLiteracyDashboardAdministration"
