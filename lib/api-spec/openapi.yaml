openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ReMynd Assessment Operating System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cases
    description: Case management
  - name: assessments
    description: Assessment tools
  - name: assignments
    description: Assessment assignments
  - name: responses
    description: Form responses
  - name: scores
    description: Scoring operations
  - name: reports
    description: AI report generation
  - name: users
    description: User management
  - name: external
    description: External respondent (no login required)
  - name: batteries
    description: Assessment battery management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Cases ───────────────────────────────────────────────────────────────
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List all cases
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: phase
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Case"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: Case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/promotional-demo:
    post:
      operationId: restorePromotionalDemoCase
      tags: [cases]
      summary: Restore the fixed synthetic promotional walkthrough case
      description: Admin-only. Atomically creates or resets the single fictional test-mode promotional case. It does not create recipients, send messages, or invoke AI.
      responses:
        "200":
          description: Promotional demo case restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get case details
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseRequest"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{caseId}/advance:
    post:
      operationId: advanceCasePhase
      tags: [cases]
      summary: Advance case to next phase
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"

  /cases/{caseId}/step-back:
    post:
      operationId: stepBackCasePhase
      tags: [cases]
      summary: Return a case to the previous phase or a selected earlier phase
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CasePhaseReturnInput"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          description: Target must be an earlier displayed phase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/intake-analysis:
    post:
      operationId: analyzeIntake
      tags: [cases]
      summary: Run AI intake analysis
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Intake analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeAnalysis"

  /cases/{caseId}/intake-question-requests:
    get:
      operationId: listIntakeQuestionRequests
      tags: [cases]
      summary: List question invitations and responses for a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Question requests, including unsent and submitted statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntakeQuestionRequest"
    post:
      operationId: createIntakeQuestionRequest
      tags: [cases]
      summary: Snapshot suggested questions and send an invitation
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeQuestionRequestInput"
      responses:
        "201":
          description: Created and sent question request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeQuestionRequest"
        "502":
          description: Request persisted but email delivery failed; requestId can be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeQuestionRequestDeliveryError"

  /cases/{caseId}/intake-question-requests/{id}/send:
    post:
      operationId: sendIntakeQuestionRequest
      tags: [cases]
      summary: Send or resend a question invitation
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeQuestionRequest"
        "502":
          description: Email delivery failed and the request remains retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeQuestionRequestDeliveryError"

  /cases/{caseId}/intake-question-requests/test-email:
    post:
      operationId: sendIntakeQuestionTestEmail
      tags: [cases]
      summary: Email a test copy of current suggested questions to the signed-in admin
      description: Sends a branded email linking to a short-lived, read-only preview of the respondent portal. Does not create an invitation or accept responses.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeQuestionTestEmailInput"
      responses:
        "200":
          description: Test email accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeQuestionTestEmailResult"

  /cases/{caseId}/intake-follow-up:
    put:
      operationId: saveIntakeFollowUp
      tags: [cases]
      summary: Save a response to a generated teacher or parent question
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeFollowUpInput"
      responses:
        "200":
          description: Updated follow-up answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeFollowUpResult"

  /cases/{caseId}/intake-group-response:
    put:
      operationId: saveIntakeGroupResponse
      tags: [cases]
      summary: Save one combined response for the teacher or parent question set
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeGroupResponseInput"
      responses:
        "200":
          description: Saved group response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeGroupResponseInput"

  /cases/{caseId}/intake-discussion:
    post:
      operationId: discussIntake
      tags: [cases]
      summary: Ask the intake advisor a case-specific question
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeDiscussionInput"
      responses:
        "200":
          description: Saved advisory reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeDiscussionResult"

  /cases/{caseId}/intake-lead-context:
    put:
      operationId: saveIntakeLeadContext
      tags: [cases]
      summary: Save assessment lead's verified context for future intake regeneration
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeLeadContextInput"
      responses:
        "200":
          description: Saved context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeLeadContextResult"

  # ─── Assessment Tools ─────────────────────────────────────────────────────
  /assessment-tools:
    get:
      operationId: listAssessmentTools
      tags: [assessments]
      summary: List assessment tools
      responses:
        "200":
          description: List of assessment tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentTool"
    post:
      operationId: createAssessmentTool
      tags: [assessments]
      summary: Create a new assessment tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssessmentToolRequest"
      responses:
        "201":
          description: Created tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentTool"

  /assessment-tools/{id}:
    patch:
      operationId: updateAssessmentTool
      tags: [assessments]
      summary: Update an assessment tool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssessmentToolRequest"
      responses:
        "200":
          description: Updated tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentTool"
    delete:
      operationId: deleteAssessmentTool
      tags: [assessments]
      summary: Delete an assessment tool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /assessment-tools/recommend:
    post:
      operationId: recommendTools
      tags: [assessments]
      summary: AI-recommend tools based on intake analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendToolsRequest"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolRecommendations"

  # ─── Assignments ──────────────────────────────────────────────────────────
  /cases/{caseId}/assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments for a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create assignment(s) for a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /cases/{caseId}/battery-review:
    get:
      operationId: getCaseBatteryReview
      tags: [assignments]
      summary: Get the current staff review and approval state for an assessment battery
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current battery review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryReviewStatus"
        "403":
          description: Staff review access required
        "404":
          description: Case not found

  /cases/{caseId}/battery-review/approve:
    post:
      operationId: approveCaseBatteryReview
      tags: [assignments]
      summary: Approve the current assessment battery for respondent invitations (administrator only)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveBatteryReviewInput"
      responses:
        "200":
          description: Approved battery review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryReviewStatus"
        "400":
          description: Invalid fingerprint
        "403":
          description: Administrator access required
        "404":
          description: Case not found
        "409":
          description: Battery changed or has unresolved review blockers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/assignments/{assignmentId}/staff-preview:
    get:
      operationId: getStaffAssignmentPreview
      tags: [assignments]
      summary: Preview the frozen form assigned to a case without opening or submitting the respondent form
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Non-submittable preview payload for the exact assigned form snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAssignmentPreview"
        "403":
          description: Staff review access required
        "404":
          description: Assignment not found
        "409":
          description: Frozen form snapshot is missing or invalid

  /cases/{caseId}/assignments/reset-completed:
    post:
      operationId: resetCompletedAssignments
      tags: [assignments]
      summary: Reset completed assignments for an approved battery
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetCompletedAssignmentsInput"
      responses:
        "200":
          description: Number of completed assignments reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedAssignmentResetResult"
        "403":
          description: Administrator or psychometrician access required
        "409":
          description: Current assessment battery is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryReviewBlockedError"

  /cases/{caseId}/send-respondent-email:
    post:
      operationId: sendRespondentEmail
      tags: [assignments]
      summary: Send an assignment link after administrator battery approval
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRespondentEmailInput"
      responses:
        "200":
          description: Invitation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespondentEmailSendResult"
        "400":
          description: Invalid email or assignment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator or psychometrician access required
        "409":
          description: Current assessment battery is not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryReviewBlockedError"
        "502":
          description: Invitation email could not be sent

  /cases/{caseId}/battery-test-email:
    post:
      operationId: sendBatteryTestPackageEmail
      tags: [assignments]
      summary: Email a non-submitting assessment test package link to any email address (administrator only)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatteryTestEmailInput"
      responses:
        "200":
          description: Test-only link emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryTestEmailResult"
        "400":
          description: Invalid email or package selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
        "404":
          description: Case not found
        "409":
          description: Selected form snapshots are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Test email could not be sent
        "503":
          description: Assessment test links are not configured

  /external/battery-test:
    get:
      operationId: getBatteryTestPackage
      tags: [external]
      summary: Load an expiring non-submitting test package using its emailed bearer token
      parameters:
        - name: X-Battery-Test-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test-only package form list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryTestPackage"
        "410":
          description: Invalid, expired, or stale test package link
        "503":
          description: Test link signing key is not configured

  /external/battery-test/forms/{assignmentId}:
    get:
      operationId: getBatteryTestPackageForm
      tags: [external]
      summary: Load one frozen form in an expiring non-submitting test package
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
        - name: X-Battery-Test-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Form preview compatible with the staff form viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAssignmentPreview"
        "410":
          description: Invalid, expired, stale, or unlisted test package form
        "503":
          description: Test link signing key is not configured

  /cases/{caseId}/assignments/{assignmentId}:
    patch:
      operationId: updateAssignment
      tags: [assignments]
      summary: Update assignment status
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentRequest"
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  # ─── External Respondent ─────────────────────────────────────────────────
  /external/form/{token}:
    get:
      operationId: getExternalForm
      tags: [external]
      summary: Get form for external respondent (no auth)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Form data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalForm"
        "404":
          description: Token not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external/portal/{token}:
    get:
      operationId: getExternalPortal
      tags: [external]
      summary: Get assignment portal or minimal question-only invitation portal
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Portal response with requests for this assignment, or the isolated question-only portal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPortal"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external/portal/{token}/intake-questions/{id}/submit:
    post:
      operationId: submitExternalIntakeQuestion
      tags: [external]
      summary: Submit or revise an invited teacher or parent response
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeQuestionAnswerInput"
      responses:
        "200":
          description: Saved answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalIntakeQuestionRequest"
        "400":
          description: Answer is blank or exceeds 20,000 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Question request does not belong to this portal token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external/form/{token}/submit:
    post:
      operationId: submitExternalForm
      tags: [external]
      summary: Submit form response (no auth)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFormRequest"
      responses:
        "200":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitFormResponse"

  # ─── Self-Report Admin ────────────────────────────────────────────────────
  /cases/{caseId}/self-report:
    post:
      operationId: submitSelfReport
      tags: [responses]
      summary: Submit guided self-report
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfReportRequest"
      responses:
        "201":
          description: Self-report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"

  # ─── Scores ───────────────────────────────────────────────────────────────
  /cases/{caseId}/scores:
    get:
      operationId: getCaseScores
      tags: [scores]
      summary: Get all scores for a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Score"

  /cases/{caseId}/scores/calculate:
    post:
      operationId: calculateScores
      tags: [scores]
      summary: Calculate/recalculate scores for a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Calculated scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Score"

  /cases/{caseId}/scores/manual:
    post:
      operationId: submitManualScore
      tags: [scores]
      summary: Submit manual score (external tools)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualScoreRequest"
      responses:
        "201":
          description: Score submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"

  # ─── Reports ──────────────────────────────────────────────────────────────
  /cases/{caseId}/report:
    get:
      operationId: getCaseReport
      tags: [reports]
      summary: Get the report for a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: No report yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{caseId}/report/generate:
    post:
      operationId: generateReport
      tags: [reports]
      summary: AI-generate report
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /cases/{caseId}/report/update:
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Admin edits to the report
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /cases/{caseId}/report/approve:
    post:
      operationId: approveReport
      tags: [reports]
      summary: Admin approves report
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  # ─── Users ────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List internal users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/login:
    post:
      operationId: login
      tags: [users]
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/logout:
    post:
      operationId: logout
      tags: [users]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ─── Dashboard ────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [cases]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─── Batteries ────────────────────────────────────────────────────────────
  /batteries:
    get:
      operationId: listBatteries
      tags: [batteries]
      summary: List all assessment batteries
      responses:
        "200":
          description: List of batteries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Battery"

  /batteries/{id}:
    get:
      operationId: getBattery
      tags: [batteries]
      summary: Get a single battery with its tools
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Battery detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryDetail"
        "404":
          description: Not found
    patch:
      operationId: updateBatteryTools
      tags: [batteries]
      summary: Update the tool list for a battery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBatteryToolsRequest"
      responses:
        "200":
          description: Updated battery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Battery"
        "404":
          description: Not found

  /cases/{caseId}/batteries/{batteryId}/assign:
    post:
      operationId: assignBattery
      tags: [batteries]
      summary: Assign all tools in a battery to a case (bulk create assignments)
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
        - name: batteryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBatteryRequest"
      responses:
        "201":
          description: Assignments created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignBatteryResponse"
        "404":
          description: Battery or case not found

  /cases/{caseId}/cdp/profile:
    get:
      operationId: getCdpProfile
      tags: [batteries]
      summary: Get CDP Battery composite profile for a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CDP profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CdpProfile"

  /cases/{caseId}/chinese-literacy/dashboard:
    get:
      operationId: getChineseLiteracyDashboard
      tags: [chinese-literacy]
      summary: Get source-separated Chinese Literacy submissions and latest comparison draft
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parent and teacher submissions, with the latest saved source comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChineseLiteracyDashboardResponse"
        "403":
          description: Not authorized for this case
        "404":
          description: Case not found
    post:
      operationId: generateChineseLiteracyDashboardComparison
      tags: [chinese-literacy]
      summary: Generate and save a DeepSeek comparison draft from one parent and one teacher submission
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChineseLiteracyDashboardComparisonInput"
      responses:
        "200":
          description: Saved comparison draft tied to the selected source revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChineseLiteracyDashboardComparison"
        "400":
          description: Invalid source selection
        "403":
          description: Not authorized for this case
        "409":
          description: One or both respondent submissions changed during generation
        "422":
          description: Both selected source forms must be submitted
        "502":
          description: DeepSeek could not produce a valid comparison

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # ─── User ────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, assessment_invigilator, psychometrician, school_clinical_coordinator, clinical_apprentice]
        schoolName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, createdAt]

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, assessment_invigilator, psychometrician, school_clinical_coordinator, clinical_apprentice]
        school_name:
          type: string
          nullable: true
      required: [name, email, password, role]

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, assessment_invigilator, psychometrician, school_clinical_coordinator, clinical_apprentice]
        school_name:
          type: string
          nullable: true

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    UserLoginResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    # ─── Case ────────────────────────────────────────────────────────────────
    Case:
      type: object
      properties:
        id:
          type: string
        studentName:
          type: string
        dob:
          type: string
        school:
          type: string
        grade:
          type: string
        languagePreference:
          type: string
          enum: [english, mandarin, cantonese]
        referralReason:
          type: string
        caseStatus:
          type: string
          enum: [active, on_hold, completed, archived]
        caseMode:
          type: string
          enum: [live, test]
        currentPhase:
          type: string
          enum: [pre_commitment, intake, setup, forms, assessment, scoring, report, debrief, complete]
        progressPercentage:
          type: integer
          minimum: 0
          maximum: 100
        riskLevel:
          type: string
          enum: [low, moderate, high]
          nullable: true
        assignedLeadId:
          type: string
          nullable: true
        assignedPsychId:
          type: string
          nullable: true
        parentName:
          type: string
          nullable: true
        parentEmail:
          type: string
          nullable: true
        parentPhone:
          type: string
          nullable: true
        consentObtained:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - studentName
        - dob
        - school
        - languagePreference
        - caseStatus
        - currentPhase
        - progressPercentage
        - consentObtained
        - createdAt
        - updatedAt

    CaseDetail:
      allOf:
        - $ref: "#/components/schemas/Case"
        - type: object
          properties:
            assignments:
              type: array
              items:
                $ref: "#/components/schemas/Assignment"
            scores:
              type: array
              items:
                $ref: "#/components/schemas/Score"
            intakeData:
              type: object
              nullable: true
            intakeAnalysis:
              $ref: "#/components/schemas/IntakeAnalysis"
              nullable: true

    CreateCaseRequest:
      type: object
      properties:
        studentName:
          type: string
        dob:
          type: string
        school:
          type: string
        grade:
          type: string
        languagePreference:
          type: string
          enum: [english, mandarin, cantonese]
        referralReason:
          type: string
        caseMode:
          type: string
          enum: [live, test]
          description: Defaults to "live" if omitted. "test" marks a training/practice case with no real student, on which Clinical Apprentices get full edit access.
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        assignedLeadId:
          type: string
        assignedPsychId:
          type: string
      required: [studentName, dob, school, languagePreference, referralReason]

    UpdateCaseRequest:
      type: object
      properties:
        studentName:
          type: string
        dob:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Corrected date of birth, used to calculate age for intake analysis.
        school:
          type: string
        grade:
          type: string
        languagePreference:
          type: string
          enum: [english, mandarin, cantonese]
        caseStatus:
          type: string
          enum: [active, on_hold, completed, archived]
        caseMode:
          type: string
          enum: [live, test]
        currentPhase:
          type: string
          enum: [pre_commitment, intake, setup, forms, assessment, scoring, report, debrief, complete]
        riskLevel:
          type: string
          enum: [low, moderate, high]
        parentName:
          type: string
        parentEmail:
          type: string
        parentPhone:
          type: string
        assignedLeadId:
          type: string
        assignedPsychId:
          type: string
        consentObtained:
          type: boolean

    CasePhaseReturnInput:
      type: object
      properties:
        targetPhase:
          type: string
          enum: [intake, assessment, scoring, report, final_review, debrief, complete]
          description: Omit to step back one internal phase; provide an earlier displayed phase to jump directly.

    IntakeAnalysis:
      type: object
      properties:
        recommendedDomains:
          type: array
          items:
            type: string
        riskLevel:
          type: string
          enum: [low, moderate, high]
        summary:
          type: string
        flags:
          type: array
          items:
            type: string
      required: [recommendedDomains, riskLevel, summary]

    IntakeQuestionRequestInput:
      type: object
      required: [audience]
      properties:
        audience: { type: string, enum: [teacher, parent] }
        assignmentId: { type: string }
        recipientName: { type: string, minLength: 1, maxLength: 200 }
        recipientEmail: { type: string, format: email, maxLength: 320 }
      description: Provide assignmentId, or provide both recipientName and recipientEmail.
    IntakeQuestionTestEmailInput:
      type: object
      required: [audience]
      properties:
        audience: { type: string, enum: [teacher, parent] }
    IntakeQuestionTestEmailResult:
      type: object
      required: [recipientEmail, questionCount]
      properties:
        recipientEmail: { type: string, format: email }
        questionCount: { type: integer }
    IntakeQuestionRequest:
      type: object
      required: [id, audience, recipientName, recipientEmail, questions, answer, sentAt, submittedAt, portalUrl]
      properties:
        id: { type: string }
        audience: { type: string, enum: [teacher, parent] }
        assignmentId: { type: [string, "null"] }
        recipientName: { type: string }
        recipientEmail: { type: string, format: email }
        questions:
          type: array
          items: { type: string }
        answer: { type: [string, "null"] }
        sentAt: { type: [string, "null"], format: date-time }
        submittedAt: { type: [string, "null"], format: date-time }
        portalUrl: { type: string, format: uri }
    IntakeQuestionRequestDeliveryError:
      type: object
      required: [error, requestId, message, item]
      properties:
        error: { type: string }
        requestId: { type: string }
        message: { type: string }
        item:
          $ref: "#/components/schemas/IntakeQuestionRequest"
    IntakeQuestionAnswerInput:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 20000 }
    ExternalIntakeQuestionRequest:
      type: object
      required: [id, audience, questions, answer, submittedAt, recipientName]
      properties:
        id: { type: string }
        audience: { type: string, enum: [teacher, parent] }
        questions:
          type: array
          items: { type: string }
        answer: { type: [string, "null"] }
        submittedAt: { type: [string, "null"], format: date-time }
        recipientName: { type: string }
    ExternalPortal:
      type: object
      required: [questionRequests]
      properties:
        questionOnly: { type: boolean }
        studentName: { type: string }
        assignedToName: { type: [string, "null"] }
        respondentLabel: { type: string }
        respondentType: { type: string, enum: [teacher, parent] }
        role: { type: string, enum: [teacher, parent] }
        languagePreference: { type: string }
        questionRequests:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIntakeQuestionRequest"

    IntakeFollowUpInput:
      type: object
      required: [audience, question, answer]
      properties:
        audience: { type: string, enum: [teacher, parent] }
        question: { type: string, minLength: 1, maxLength: 2000 }
        answer: { type: string, maxLength: 20000 }
    IntakeFollowUpResult:
      type: object
      required: [audience, question, answer]
      properties:
        audience: { type: string, enum: [teacher, parent] }
        question: { type: string }
        answer: { type: string }
    IntakeGroupResponseInput:
      type: object
      required: [audience, answer]
      properties:
        audience: { type: string, enum: [teacher, parent] }
        answer: { type: string, maxLength: 20000 }
    IntakeDiscussionInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
    IntakeDiscussionResult:
      type: object
      required: [reply]
      properties:
        reply: { type: string }
    IntakeLeadContextInput:
      type: object
      required: [context]
      properties:
        context: { type: string, maxLength: 20000 }
    IntakeLeadContextResult:
      type: object
      required: [context]
      properties:
        context: { type: string }

    # ─── Assessment Tool ──────────────────────────────────────────────────────
    AssessmentTool:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        isRemyndOwned:
          type: boolean
        respondentTypes:
          type: array
          items:
            type: string
            enum: [parent, teacher1, teacher2, student, self, referring_teacher, boarding_staff, school_counselor, special_needs_teacher, invigilator]
        scoringType:
          type: string
          enum: [auto, manual]
        domains:
          type: array
          items:
            type: string
        productIds:
          type: array
          items:
            type: string
      required: [id, name, category, isRemyndOwned, respondentTypes, scoringType, domains]

    CreateAssessmentToolRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        scoringType:
          type: string
          enum: [auto, manual]
        domains:
          type: array
          items:
            type: string
        respondentTypes:
          type: array
          items:
            type: string
        isRemyndOwned:
          type: boolean
        formItems:
          type: array
          items:
            type: object
        scoringConfig:
          type: object
          nullable: true
      required: [id, name, category]

    UpdateBatteryToolsRequest:
      type: object
      properties:
        toolIds:
          type: array
          items:
            type: string
      required: [toolIds]

    UpdateAssessmentToolRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        scoringType:
          type: string
          enum: [auto, manual]
        domains:
          type: array
          items:
            type: string
        respondentTypes:
          type: array
          items:
            type: string
        isRemyndOwned:
          type: boolean
        formItems:
          type: array
          items:
            type: object
        scoringConfig:
          type: object
          nullable: true
        productIds:
          type: array
          items:
            type: string

    RecommendToolsRequest:
      type: object
      properties:
        caseId:
          type: string
        domains:
          type: array
          items:
            type: string
        riskLevel:
          type: string
      required: [caseId, domains, riskLevel]

    ToolRecommendations:
      type: object
      properties:
        recommended:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentTool"
        rationale:
          type: string
      required: [recommended, rationale]

    # ─── Assignment ───────────────────────────────────────────────────────────
    Assignment:
      type: object
      properties:
        id:
          type: string
        caseId:
          type: string
        toolId:
          type: string
        toolName:
          type: string
        respondentType:
          type: string
          enum: [parent, teacher1, teacher2, student, self, referring_teacher, boarding_staff, school_counselor, special_needs_teacher, invigilator]
        respondentLabel:
          type: string
        assignedToName:
          type: string
          nullable: true
        assignedToEmail:
          type: string
          nullable: true
        uniqueToken:
          type: string
        uniqueLink:
          type: string
        qrCodeData:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, completed, overdue]
        dueDate:
          type: string
          format: date-time
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - caseId
        - toolId
        - toolName
        - respondentType
        - respondentLabel
        - uniqueToken
        - uniqueLink
        - qrCodeData
        - status
        - createdAt

    BatteryReviewApproval:
      type: object
      properties:
        approvedAt:
          type: string
          format: date-time
        approvedBy:
          type: string
      required: [approvedAt, approvedBy]

    BatteryReviewStatus:
      type: object
      properties:
        approved:
          type: boolean
        approval:
          anyOf:
            - $ref: "#/components/schemas/BatteryReviewApproval"
            - type: "null"
        assignmentCount:
          type: integer
          minimum: 0
        missingSnapshots:
          type: integer
          minimum: 0
        issues:
          type: array
          items:
            type: string
        fingerprint:
          type: string
      required: [approved, approval, assignmentCount, missingSnapshots, issues, fingerprint]

    ApproveBatteryReviewInput:
      type: object
      properties:
        fingerprint:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
      required: [fingerprint]

    BatteryTestEmailInput:
      type: object
      properties:
        toEmail:
          type: string
          format: email
          maxLength: 254
        assignmentIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 256
      required: [toEmail, assignmentIds]
      additionalProperties: false

    BatteryTestEmailResult:
      type: object
      properties:
        success:
          type: boolean
          const: true
        expiresAt:
          type: string
