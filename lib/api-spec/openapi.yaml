          type: integer
        applicableCount:
          type: integer
        notObservedCount:
          type: integer
        notApplicableCount:
          type: integer
        unansweredCount:
          type: integer
        ratingCounts:
          type: object
          additionalProperties:
            type: integer
        evidence:
