          type: string
        setting:
          type: string
        respondentType:
          type: string
        respondentLabel:
          type: string
        status:
          type: string
        assignmentStatus:
          type: string
        revision:
          type: integer
        submittedAt:
          type: ["string", "null"]
        baselineId:
          type: ["string", "null"]
        instrumentVersion:
          type: string
        scoringVersion:
          type: string
