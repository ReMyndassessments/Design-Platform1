        itemResponses:
          type: array
          items:
            $ref: "#/components/schemas/ChineseLiteracyDashboardItemResponse"
      required: [id, name, status, mean, coverage, validCount, applicableCount, notObservedCount, notApplicableCount, unansweredCount, ratingCounts, evidence, itemResponses]

